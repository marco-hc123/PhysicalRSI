<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>研究图表</title><style>body{font-family:"Noto Sans CJK SC","Microsoft YaHei",Arial,sans-serif;color:#203143;background:#f5f7fa;margin:0;line-height:1.8}main{max-width:1120px;margin:32px auto;padding:36px 48px;background:white}h1{font-size:30px;line-height:1.5}h2{font-size:22px;border-bottom:1px solid #ccd5df;padding-bottom:8px;margin-top:42px}h3{font-size:18px}a{color:#1e668d}p{margin:13px 0}small,.muted{color:#536475}.notice{background:#f5eee7;padding:14px 18px;border-left:4px solid #b77842}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:20px}figure{margin:18px 0;padding:16px;background:#f7f9fc}img,video{max-width:100%;height:auto}figcaption{font-size:14px}table{border-collapse:collapse;display:block;overflow:auto;width:100%;font-size:14px}th,td{padding:9px 12px;border-bottom:1px solid #dae1e8;text-align:left;vertical-align:top}th{background:#e8eef4}code{word-break:break-all}nav a{margin-right:18px}pre{white-space:pre-wrap;overflow-wrap:anywhere}@media(max-width:700px){main{margin:0;padding:20px}}@media print{body{background:white}main{margin:0;padding:0}video{display:none}h2,figure{break-inside:avoid}}</style><main><nav><a href="index.html">总入口</a><a href="report.html">详细报告</a><a href="figures.html">图表</a><a href="media.html">视频与关键帧</a><a href="evidence.html">证据索引</a></nav><h1>图表与可编辑数据</h1><p>每张图同时保留PNG、带文字与矢量对象的SVG，以及绘图数据。统计范围与限制见图注。</p><figure><h2>F01_feedback_partial 增强反馈出现有限部分分</h2><img src="04_figures/F01_feedback_partial.png" alt="增强反馈出现有限部分分"><figcaption>每候选仅5个已暴露布局，不能视为独立泛化。<br>来源：B31; derived/cohort_results_pre43.json<br><a href="04_figures/F01_feedback_partial.svg">可编辑SVG</a> · <a href="04_figures/F01_feedback_partial.data.json">图表数据JSON</a></figcaption></figure><figure><h2>F02_process_vs_score 过程修正与任务得分分开报告</h2><img src="04_figures/F02_process_vs_score.png" alt="过程修正与任务得分分开报告"><figcaption>三个面板属于不同阶段，单位与执行条件不同；B40对照复用B39。<br>来源：B34/B36/B40 FINAL_SUMMARY.json<br><a href="04_figures/F02_process_vs_score.svg">可编辑SVG</a> · <a href="04_figures/F02_process_vs_score.data.json">图表数据JSON</a></figcaption></figure><figure><h2>F03_nov7_score_matrix 11月7日逐布局结果</h2><img src="04_figures/F03_nov7_score_matrix.png" alt="11月7日逐布局结果"><figcaption>独立布局与开发ID相同但场景不同；未准入候选不填0。<br>来源：B42 original native receipts; derived/cohort_results_pre43.json<br><a href="04_figures/F03_nov7_score_matrix.svg">可编辑SVG</a> · <a href="04_figures/F03_nov7_score_matrix.data.json">图表数据JSON</a></figcaption></figure><figure><h2>F04_generation_input 候选生成输入Token</h2><img src="04_figures/F04_generation_input.png" alt="候选生成输入Token"><figcaption>跨批次反馈、模型推理设置与协议有差异；不可按时间作因果趋势。<br>来源：derived/api_by_condition.json; provider usage<br><a href="04_figures/F04_generation_input.svg">可编辑SVG</a> · <a href="04_figures/F04_generation_input.data.json">图表数据JSON</a></figcaption></figure><figure><h2>F05_system2_evidence_chain System2证据链</h2><img src="04_figures/F05_system2_evidence_chain.png" alt="System2证据链"><figcaption>概念流程图；不是声称已完成官方全量benchmark。<br>来源：Frozen protocols B29/B42/B43<br><a href="04_figures/F05_system2_evidence_chain.svg">可编辑SVG</a> · <a href="04_figures/F05_system2_evidence_chain.data.json">图表数据JSON</a></figcaption></figure><figure><h2>F06_wrapper_correction 已确认的适配层问题</h2><img src="04_figures/F06_wrapper_correction.png" alt="已确认的适配层问题"><figcaption>修复恢复分支不等于完成抓取，也不证明PhysicalRSI通用框架有同一错误。<br>来源：B40 HISTORICAL_CONTRACT_CORRECTION.txt and FINAL_SUMMARY.json<br><a href="04_figures/F06_wrapper_correction.svg">可编辑SVG</a> · <a href="04_figures/F06_wrapper_correction.data.json">图表数据JSON</a></figcaption></figure><figure><h2>F07_classify_objects_multitask 分类任务的开发与独立布局结果</h2><img src="04_figures/F07_classify_objects_multitask.png" alt="分类任务的开发与独立布局结果"><figcaption>每split计划五布局。N/A为中断缺失原生终态分数，不填0；success分母仅完整评分回合。独立布局不用于选策略，共享父策略不重复执行。抓取要求抬升10cm，不等于分类搬运。<br>来源：B43 FINAL_SUMMARY and each phase analysis/summary.json<br><a href="04_figures/F07_classify_objects_multitask.svg">可编辑SVG</a> · <a href="04_figures/F07_classify_objects_multitask.data.json">图表数据JSON</a></figcaption></figure><figure><h2>F08_general_pickup_multitask 抓取任务的开发与独立布局结果</h2><img src="04_figures/F08_general_pickup_multitask.png" alt="抓取任务的开发与独立布局结果"><figcaption>每split计划五布局。N/A为中断缺失原生终态分数，不填0；success分母仅完整评分回合。独立布局不用于选策略，共享父策略不重复执行。抓取要求抬升10cm，不等于分类搬运。<br>来源：B43 FINAL_SUMMARY and each phase analysis/summary.json<br><a href="04_figures/F08_general_pickup_multitask.svg">可编辑SVG</a> · <a href="04_figures/F08_general_pickup_multitask.data.json">图表数据JSON</a></figcaption></figure><figure><h2>F09_multitask_stop_patterns 多任务候选的停止模式</h2><img src="04_figures/F09_multitask_stop_patterns.png" alt="多任务候选的停止模式"><figcaption>每组3候选×相同5开发布局；不是15个独立生成样本。正常return不等于成功，成功也会终止活动动作。这是停止现象，不是根因证明；未包含父策略及独立布局中断。<br>来源：B43原始RPC、native回执和同主机单调时间对应；见mechanism-audit.json<br><a href="04_figures/F09_multitask_stop_patterns.svg">可编辑SVG</a> · <a href="04_figures/F09_multitask_stop_patterns.data.json">图表数据JSON</a></figcaption></figure></main></html>
